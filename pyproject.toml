[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voron-matsam"
version = "0.1.0"
description = "Controlled H1 experiments for soft Voronoi microscopy segmentation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
data = ["Pillow>=10", "tifffile>=2024.8.30", "scikit-image>=0.24"]

[project.scripts]
voron-baseline = "voron_matsam.baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
